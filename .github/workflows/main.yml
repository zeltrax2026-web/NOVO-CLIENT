
name: Build NOVA CLIENT

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Extract NOVA source
        run: |
          mkdir -p source
          ZIP=$(find . -maxdepth 1 -iname '*.zip' -print -quit)
          if [ -z "$ZIP" ]; then
            echo "Source ZIP not found"
            exit 1
          fi
          unzip -q "$ZIP" -d source

      - name: Find and build NOVA
        run: |
          BUILD=$(find source -type f \( -name build.gradle -o -name build.gradle.kts \) -print -quit)
          if [ -z "$BUILD" ]; then
            echo "Gradle build file not found"
            exit 1
          fi
          DIR=$(dirname "$BUILD")
          if [ -f "$DIR/gradlew" ]; then
            chmod +x "$DIR/gradlew"
            cd "$DIR"
            ./gradlew build --no-daemon
          else
            echo "Gradle wrapper not found"
            exit 1
          fi

      - name: Upload NOVA JAR
        uses: actions/upload-artifact@v4
        with:
          name: NOVA-CLIENT-JAR
          path: source/**/build/libs/*.jar
          if-no-files-found: error
          
