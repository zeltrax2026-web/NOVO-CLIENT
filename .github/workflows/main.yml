name: Build NOVA CLIENT

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # Fabric Loom 1.14 needs Gradle 9.2 or newer (8.x fails right away)
      - name: Set up Gradle 9.2.1
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '9.2.1'

      # Works whether build.gradle is in the repo root or inside a sub-folder
      - name: Find the Gradle project folder
        id: proj
        run: |
          settings=$(find . -maxdepth 3 -name settings.gradle -not -path './.git/*' -print -quit)
          if [ -z "$settings" ]; then
            echo "::error::settings.gradle not found - upload build.gradle, settings.gradle and src/ to the repo"
            exit 1
          fi
          echo "dir=$(dirname "$settings")" >> "$GITHUB_OUTPUT"

      - name: Build
        working-directory: ${{ steps.proj.outputs.dir }}
        run: |
          gradle build --no-daemon --stacktrace
          rm -f build/libs/*-sources.jar

      - name: Upload the mod JAR
        uses: actions/upload-artifact@v6
        with:
          name: NOVA-CLIENT
          path: ${{ steps.proj.outputs.dir }}/build/libs/*.jar
          if-no-files-found: error



          
