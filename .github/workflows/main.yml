
name: Build NOVA CLIENT

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Extract NOVA source
        run: unzip NovaClient-Ultimate-Source.zip -d source

      - name: Build NOVA
        working-directory: source/nova-client
        run: gradle build --no-daemon

      - name: Upload NOVA JAR
        uses: actions/upload-artifact@v4
        with:
          name: NOVA-CLIENT-JAR
          path: source/nova-client/build/libs/*.jar
          
